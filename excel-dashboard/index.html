<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Analytics Dashboard - Tree View</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Visualization -->
    <script src="vendor/chart.umd.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="css/tree.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-chart-line"></i>
            <h1 style="display: flex; align-items: center; gap: 10px;">
                Excel Analytics Dashboard
                <span id="user-role-badge" style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #3498db; color: white; text-transform: uppercase; letter-spacing: 1px;"></span>
            </h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="backToPortalBtn" onclick="window.location.href='../admin_dashboard.html'" class="home-btn" aria-label="Back to Portal" style="background: #f8f9fa; color: #333; border: 1px solid #ddd;">
                <i class="fa-solid fa-arrow-left"></i> Back to Portal
            </button>
            <button onclick="window.location.href='dashboard.html'" class="home-btn" aria-label="Upload Dashboard">
                <i class="fa-solid fa-upload"></i> Upload Dashboard
            </button>
            <button onclick="logoutUser()" class="home-btn" aria-label="Logout" style="background: #ffeaa7; color: #d35400; border: 1px solid #f1c40f;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        <aside class="sidebar">
            <div id="tree-container" class="tree-container" role="tree" aria-label="Units Hierarchy">
                <!-- Tree will be dynamically generated here by tree.js -->
            </div>
        </aside>
        
        <section class="content-area">
            <div id="unit-details" class="unit-details">
                <h2 id="content-title">Select a Unit</h2>
                <div id="content-body" class="content-body">
                    <p class="placeholder-text">Please select a unit from the tree on the left to view its analytics.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('userRole');
            
            // Set Badge
            const badge = document.getElementById('user-role-badge');
            if (badge && role) {
                badge.innerText = role;
                if(role === 'admin') badge.style.background = '#e74c3c';
                else if(role === 'editor') badge.style.background = '#2ecc71';
                else badge.style.background = '#3498db';
            }

            if (role !== 'admin') {
                const backBtn = document.getElementById('backToPortalBtn');
                if (backBtn) backBtn.style.display = 'none';
            }
        });

        function logoutUser() {
            localStorage.removeItem('userRole');
            window.location.href = '../login.html';
        }
    </script>
    <script src="js/realData.js"></script>
    <script src="js/tree.js"></script>
</body>
</html>
